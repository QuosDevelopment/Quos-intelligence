services:
  - type: web
    name: quos-intelligence
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node app.js
    envVars:
      - key: GEMINI_API_KEY
        value: your_gemini_api_key_here
      - key: OPENSERP_API_KEY
        value: your_openserp_api_key_here
      - key: GITHUB_TOKEN
        value: your_github_token_here
      - key: VERCEL_TOKEN
        value: your_vercel_token_here